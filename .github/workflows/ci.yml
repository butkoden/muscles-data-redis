name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: feature/task-68-data-rc-readiness
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

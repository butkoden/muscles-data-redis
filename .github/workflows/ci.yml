name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "redis>=5.0,<9.0"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles
          ref: main
          path: muscles
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./muscles --no-deps
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "redis>=5.0,<9.0"
      - run: python -m pytest -q -m integration
        env:
          MUSCLES_DATA_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379/15

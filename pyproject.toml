[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-data-redis"
version = "0.1.0"
description = "Redis KeyValuePort, LockPort and StreamPort adapter for muscles-data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Denis B.", email = "denis@butko.info" }]
dependencies = [
  "muscles-data>=0.1.0,<1.0.0",
  "redis>=5.0,<9.0",
]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-data-redis"
Repository = "https://github.com/butkoden/muscles-data-redis"
Documentation = "https://github.com/butkoden/muscles-data-redis#readme"
PyPI = "https://pypi.org/project/muscles-data-redis/"
Releases = "https://github.com/butkoden/muscles-data-redis/releases"
"muscles-data" = "https://pypi.org/project/muscles-data/"
"muscles-data-elasticsearch" = "https://pypi.org/project/muscles-data-elasticsearch/"
"muscles-data-opensearch" = "https://pypi.org/project/muscles-data-opensearch/"
"muscles-data-qdrant" = "https://pypi.org/project/muscles-data-qdrant/"
"muscles-data-mongodb" = "https://pypi.org/project/muscles-data-mongodb/"
"muscles-data-s3" = "https://pypi.org/project/muscles-data-s3/"
"muscles-data-sqlalchemy" = "https://pypi.org/project/muscles-data-sqlalchemy/"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require the local backend integration stack",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
